# Render Blueprint for the Lordina Foundation API.
# Deploy from the Render dashboard: New + -> Blueprint -> pick this repository.
services:
  - type: web
    name: lordina-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # you will paste the Render Postgres connection string
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong secret automatically
      - key: PORT
        value: "3000"
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false